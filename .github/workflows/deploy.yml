name: Test & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Read-only by default; only the deploy job gets Pages write and OIDC, so
# pull-request runs never hold deploy credentials.
permissions:
  contents: read

concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  test:
    name: Astronomical & Horological Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      # npm ci only: falling back to npm install hid lockfile drift.
      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build Standalone Bundle
        run: |
          node scripts/build.js
          grep -q 'integrity="sha384-' index.html || (echo 'SRI integrity missing from index.html' && exit 1)

      - name: Assemble GitHub Pages Distribution
        run: |
          rm -f dist/*.tmp .index.*.tmp
          mkdir -p _site
          cp index.html _site/
          cp -r dist _site/
          cp -r src _site/
          if [ -d "assets" ]; then cp -r assets _site/; fi
          rm -f _site/dist/*.tmp
          touch _site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
